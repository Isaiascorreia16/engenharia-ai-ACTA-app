name: Build APK

on:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar o Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Gerar o Gradle wrapper se faltar
        if: hashFiles('gradle/wrapper/gradle-wrapper.jar') == ''
        run: |
          VER=$(sed -nE 's/.*gradle-([0-9.]+)-(bin|all)\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)
          if [ -z "$VER" ]; then echo "Falta distributionUrl em gradle/wrapper/gradle-wrapper.properties"; exit 1; fi
          mkdir -p /tmp/w && cd /tmp/w && touch settings.gradle.kts
          gradle wrapper --gradle-version "$VER"
          cp -r gradlew gradle "$GITHUB_WORKSPACE"/

      - name: Testes unitários
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Compilar o APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar o APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: acta-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Anexar o APK à Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
